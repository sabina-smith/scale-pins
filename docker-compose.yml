services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinboard
      POSTGRES_PASSWORD: pinboard
      POSTGRES_DB: pinboard
    ports:
      - "5432:5432"
    volumes:
      - pinboard-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinboard -d pinboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pinboard-data:
